<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Case Closed - Visualizer</title>
  <style>
    body { font-family: sans-serif; margin: 10px; }
    canvas { background: #ffffff; border:1px solid #ddd; }
    #info { margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Case Closed - Visual Visualizer</h3>
  <canvas id="board" width="600" height="600"></canvas>
  <div id="info">Turn: <span id="turn">0</span></div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let gridW = 20;
let gridH = 20;

function draw(state) {
  gridW = state.width;
  gridH = state.height;
  const cellW = canvas.width / gridW;
  const cellH = canvas.height / gridH;

  // clear canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // draw Voronoi cells first
  if (state.board) {
    for (let y = 0; y < gridH; y++) {
      for (let x = 0; x < gridW; x++) {
        const cellVal = state.board[y][x];
        if (cellVal === 3) {  // agent1 Voronoi
          ctx.fillStyle = 'rgba(255,180,180,0.3)';
          ctx.fillRect(x*cellW, y*cellH, cellW, cellH);
        } else if (cellVal === 4) { // agent2 Voronoi
          ctx.fillStyle = 'rgba(150,180,255,0.3)';
          ctx.fillRect(x*cellW, y*cellH, cellW, cellH);
        }
      }
    }
  }

  // optional grid lines
  ctx.strokeStyle = '#eee';
  for (let x=0; x<=gridW; x++) {
    ctx.beginPath();
    ctx.moveTo(x * cellW, 0);
    ctx.lineTo(x * cellW, canvas.height);
    ctx.stroke();
  }
  for (let y=0; y<=gridH; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * cellH);
    ctx.lineTo(canvas.width, y * cellH);
    ctx.stroke();
  }

  // draw trails (agent1 red, agent2 blue)
  // draw trails (agent1 dark gray, agent2 black)
  ctx.globalAlpha = 0.9;
  (state.agent1_trail || []).forEach((pos,i) => {
    const x = pos[0], y = pos[1];
    ctx.fillStyle = 'rgba(10,10,10,80)';
    ctx.fillRect(x*cellW+1, y*cellH+1, cellW-2, cellH-2);
  });
  (state.agent2_trail || []).forEach((pos,i) => {
    const x = pos[0], y = pos[1];
    ctx.fillStyle = 'rgba(10,10,10,80)';
    ctx.fillRect(x*cellW+1, y*cellH+1, cellW-2, cellH-2);
  });


  // draw heads on top
  const a1 = state.agent1_trail && state.agent1_trail.length ? state.agent1_trail[state.agent1_trail.length - 1] : null;
  const a2 = state.agent2_trail && state.agent2_trail.length ? state.agent2_trail[state.agent2_trail.length - 1] : null;

  if (a1) { ctx.fillStyle = 'red'; ctx.fillRect(a1[0]*cellW+1, a1[1]*cellH+1, cellW-2, cellH-2); }
  if (a2) { ctx.fillStyle = 'blue'; ctx.fillRect(a2[0]*cellW+1, a2[1]*cellH+1, cellW-2, cellH-2); }

  document.getElementById('turn').innerText = state.turn;
  ctx.globalAlpha = 1.0;
}

async function fetchAndDraw() {
  try {
    const res = await fetch('/state');
    if (!res.ok) return;
    const state = await res.json();
    draw(state);
  } catch (e) {
    // ignore transient errors
  }
}

// poll every 250 ms
setInterval(fetchAndDraw, 250);
fetchAndDraw();
</script>
</body>
</html>
