<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #222; color: #eee; font-family: sans-serif; margin:0; padding:20px; }
    #grid {
        display: grid;
        gap: 2px; /* spacing between all cells, including repeated grids */
        margin: 20px auto;
    }
    .cell { width: 5px; height: 5px; background: #444; }
    .t1 { background: rgba(120, 10, 120, 0.8); }
    .t2 { background: red; }
    .t3 { background: blue; }
</style>
</head>
<body>

<h3>Visualizer x4</h3>
<div id="grid"></div>

<script>
function updateGrid() {
    fetch("/state")
        .then(r => r.json())
        .then(data => {
            const grid = document.getElementById("grid");
            const width = data.width;
            const height = data.height;
            
            // Total grid is doubled in both dimensions
            grid.style.gridTemplateColumns = `repeat(${width*2}, 5px)`;
            grid.innerHTML = "";

            for (let row_repeat = 0; row_repeat < 2; row_repeat++) {
                for (let y = 0; y < height; y++) {
                    for (let col_repeat = 0; col_repeat < 2; col_repeat++) {
                        for (let x = 0; x < width; x++) {
                            const cellVal = data.board[y][x];
                            const div = document.createElement("div");
                            div.classList.add("cell");
                            if (cellVal === 1) div.classList.add("t1");
                            if (cellVal === 2) div.classList.add("t2");
                            if (cellVal === 3) div.classList.add("t3");
                            grid.appendChild(div);
                        }
                    }
                }
            }
        });
}

setInterval(updateGrid, 100);
</script>

</body>
</html>
